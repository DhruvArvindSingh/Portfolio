name: Deploy devguru to DeployNet

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm i
      - name: Build project
        run: npm run build
      - name: Deploy
        env:
          DEPLOYER_TOKEN: ${{ secrets.DEPLOYER_TOKEN }}
        run: |
          # Use the smart installer from GitHub
          curl -sL https://raw.githubusercontent.com/DhruvArvindSingh/Deployer/master/deployer-frontend/public/install.sh | bash
          
          # The installer puts it in /usr/local/bin, so we just call 'deployer'
          deployer deploy --ci --token "$DEPLOYER_TOKEN"
